# Nginx configuration for junbx.cn blog
# Place at: /etc/nginx/conf.d/blog.conf

server {
    listen 80;
    server_name junbx.cn www.junbx.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name junbx.cn www.junbx.cn;

    # SSL certificates (Alibaba Cloud personal test cert)
    ssl_certificate     /etc/nginx/ssl/junbx.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/junbx.cn.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Nuxt static assets — cache aggressively
    location /_nuxt/ {
        alias /opt/blog/.output/public/_nuxt/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other public assets (images, fonts, etc.)
    location /images/ {
        alias /opt/blog/.output/public/images/;
        expires 30d;
    }
    location /favicon.svg { alias /opt/blog/.output/public/favicon.svg; }
    location /LOGO.svg   { alias /opt/blog/.output/public/LOGO.svg; }
    location /null.svg   { alias /opt/blog/.output/public/null.svg; }

    # SSE chat API — must disable buffering for streaming
    location /api/chat {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        chunked_transfer_encoding on;
    }

    # Proxy everything else to Nuxt SSR
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
